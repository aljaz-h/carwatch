name: Build and publish Docker images

# Publishes CarWatch's production images to GHCR:
#   ghcr.io/aljaz-h/carwatch-web
#   ghcr.io/aljaz-h/carwatch-worker
#
# Triggers:
#   - push to main            -> tags: latest, sha-<short sha>
#   - push of a "vX.Y.Z" tag  -> tags: X.Y.Z, X.Y, X, latest
#   - manual (workflow_dispatch), for re-running a publish without a new commit
#
# The `validate` job (install/typecheck/test/build) must succeed before
# either image is built or pushed — a broken build is never published.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # Only needs to read the repo — narrower than the top-level default,
    # which grants packages:write for the publish job below.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the pnpm shims; the exact version comes from this repo's
      # own "packageManager" field (pnpm@12.6.0), so this can never drift
      # from what Docker/local dev use.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  publish:
    name: Publish ${{ matrix.name }} image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            image: ghcr.io/aljaz-h/carwatch-web
            dockerfile: apps/web/Dockerfile
            title: CarWatch Web
            description: CarWatch web application (Next.js)
          - name: worker
            image: ghcr.io/aljaz-h/carwatch-worker
            dockerfile: apps/worker/Dockerfile
            title: CarWatch Worker
            description: CarWatch background worker (scraping, matching, alerts, migrations)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CARWATCH_VERSION baked into the image: the released version for a
      # tag push (v0.3.1 -> 0.3.1), or a dev-identifiable string for a plain
      # main-branch build. Read by both apps at runtime — see
      # apps/web/src/lib/version.ts and apps/worker/src/env.ts.
      - name: Resolve version metadata
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "git_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for linux/arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No manually created registry password: GITHUB_TOKEN is sufficient
      # for GHCR when `packages: write` is granted above.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag strategy:
      #   push to main       -> latest, sha-<short sha>
      #   push of tag vX.Y.Z -> X.Y.Z, X.Y, X, latest (+ sha-<short sha>)
      # `enable=true` on the major/major.minor patterns overrides
      # metadata-action's default of skipping bare-major tags for 0.x
      # releases — this repo is still pre-1.0, and a "0" tag was explicitly
      # requested.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=true
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=true
            type=semver,pattern={{major}},enable=true
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARWATCH_VERSION=${{ steps.vars.outputs.version }}
            CARWATCH_GIT_SHA=${{ steps.vars.outputs.git_sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
