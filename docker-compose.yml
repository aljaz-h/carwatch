name: carwatch

# Production configuration: pulls prebuilt CarWatch images published to
# GHCR by .github/workflows/docker-publish.yml — nothing is compiled on the
# host. `docker compose pull && docker compose up -d` is the whole install.
#
# Both `web` and `worker` are pinned to one shared CARWATCH_VERSION (see
# .env.example) so they can never run mismatched releases against each
# other. Leave it at `latest` to always run the newest published build, or
# pin it to an exact release (e.g. `CARWATCH_VERSION=0.3.1`) for controlled
# upgrades — see the README's Updating/Rollback sections.
#
# For local development from source instead, see docker-compose.dev.yml.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env and set it}
      POSTGRES_DB: ${POSTGRES_DB:-carwatch}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carwatch}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: only the web/worker/migrate containers on
    # the internal Docker network can reach Postgres. Use
    # `docker compose exec postgres psql -U <user> <db>` to inspect it.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host, same reasoning as postgres above.

  # One-off job: applies pending Prisma migrations (`prisma migrate deploy`,
  # never `db push`) and ensures the provider/feature catalog exists, then
  # exits. web/worker both wait on it via `service_completed_successfully`,
  # so the app never starts against a schema it doesn't match, and nothing
  # else runs migrations concurrently with it.
  migrate:
    image: ghcr.io/aljaz-h/carwatch-worker:${CARWATCH_VERSION:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-carwatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-carwatch}?schema=public
      AVTONET_ENABLED: ${AVTONET_ENABLED:-true}
      AVTONET_INTERVAL_MINUTES: ${AVTONET_INTERVAL_MINUTES:-45}
    working_dir: /app/packages/database
    command: sh -c "pnpm exec prisma migrate deploy && pnpm exec tsx src/seed-essential.ts"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/aljaz-h/carwatch-web:${CARWATCH_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-carwatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-carwatch}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/aljaz-h/carwatch-worker:${CARWATCH_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-carwatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-carwatch}?schema=public
      REDIS_URL: redis://redis:6379
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-CarWatch <no-reply@carwatch.local>}
      SCRAPE_CONCURRENCY: ${SCRAPE_CONCURRENCY:-2}
      MATCH_CONCURRENCY: ${MATCH_CONCURRENCY:-5}
      ALERT_CONCURRENCY: ${ALERT_CONCURRENCY:-5}
      SCHEDULER_RECONCILE_MINUTES: ${SCHEDULER_RECONCILE_MINUTES:-5}
      PROVIDER_RUN_RETENTION_DAYS: ${PROVIDER_RUN_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No public port: the worker has no HTTP surface. Its health is the
    # HEALTHCHECK baked into the image (heartbeat-file freshness), visible
    # via `docker compose ps`.

volumes:
  postgres-data:
  redis-data:
